{% set version = "7.0.0" %}

package:
  name: multidict
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/m/multidict/multidict-{{ version }}.tar.gz
  sha256: a7fcd089a0af2e0ef053c0d39c22c9ebf2434dddcb91034fd2f59ec99623788e

build:
  number: 0
  noarch: python  # [use_noarch]
  track_features:
    - multidict_no_compile  # [use_noarch]
  script:
    - export MULTIDICT_NO_EXTENSIONS=1   # [use_noarch]
    - {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  build:
    - python                                 # [not use_noarch and  build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [not use_noarch and  build_platform != target_platform]
    - cython                                 # [not use_noarch and  build_platform != target_platform]
    - {{ compiler('c') }}                    # [not use_noarch]
    - {{ stdlib("c") }}                      # [not use_noarch]
  host:
    - cython
    - python {{ python_min }}  # [use_noarch]
    - python                   # [not use_noarch]
    - pip
    - setuptools >=40
  run:
    - python >={{ python_min }}  # [use_noarch]
    - python                     # [not use_noarch]
    - typing-extensions >=4.1.0  # [py<311 or use_noarch]

test:
  source_files:
    - tests
  requires:
    - pytest
    - pytest-codspeed
    - objgraph
    - coverage
    - pip
    - psutil
    - python {{ python_min }}  # [use_noarch]
  commands:
    # The release notes converter test needs the `tools/` directory which is
    # not shipped in the test source files; skip it here.
    - py.test tests --no-c-extensions --ignore=tests/test_release_notes_md.py  # [use_noarch]
    - py.test tests --c-extensions --ignore=tests/test_release_notes_md.py     # [not use_noarch]
    - pip check

about:
  home: http://github.com/aio-libs/multidict
  license: Apache-2.0
  license_file: LICENSE
  summary: multidict implementation

  description: |
    Multidicts are useful for working with HTTP headers, URL query args etc.
  doc_url: http://multidict.readthedocs.io/
  dev_url: http://github.com/aio-libs/multidict

extra:
  recipe-maintainers:
    - sodre
    - kszucs
    - xhochy
